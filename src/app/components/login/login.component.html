<app-language-button />
<div class="register-form">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ "LOGIN" | translate }}</mat-card-title>
    </mat-card-header>
    <form [formGroup]="form" (ngSubmit)="login()">
      <mat-card-content class="fields">
        <mat-form-field>
          <mat-label>{{ "EMAIL" | translate }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" required>
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ "PASSWORD" | translate }}</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" required>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())" [attr.aria-label]="'PASSWORD' | translate">
            <mat-icon>{{ hidePassword() ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
        </mat-form-field>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button type="submit" [disabled]="form.invalid || busy()">{{ "LOGIN" | translate }}</button>
        <a mat-button routerLink="/register">{{ "REGISTER" | translate }}</a>
      </mat-card-actions>
    </form>
  </mat-card>
  <button mat-button type="button" class="reset-password-link" (click)="forgotPassword()">{{ "LOGIN_FORGOT_PASSWORD" | translate }}</button>
  <a routerLink="/privacy" class="privacy-link">{{ "PRIVACY" | translate }}</a>
</div>
