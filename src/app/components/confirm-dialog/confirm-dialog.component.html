<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  @if (data.message) {
    <p class="message">{{ data.message }}</p>
  }
  @if (data.details?.length) {
    <table class="details">
      @for (d of data.details; track d[0]) {
        <tr><td>{{ d[0] }}</td><td class="num">{{ d[1] }}</td></tr>
      }
    </table>
  }
  @if (data.number) {
    <mat-form-field appearance="outline" class="full">
      <mat-label>{{ data.number.label }}</mat-label>
      <input matInput type="number" inputmode="numeric" [(ngModel)]="value" [min]="data.number.min" (keydown.enter)="ok()">
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ data.cancel || ("CANCEL" | translate) }}</button>
  <button mat-flat-button [class.danger]="data.danger" [disabled]="!valid" (click)="ok()">{{ data.confirm }}</button>
</mat-dialog-actions>
