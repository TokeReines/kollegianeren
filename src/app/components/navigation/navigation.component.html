<mat-sidenav-container class="nav-container" [class.with-rail]="sidenav.showsRail()">
  <mat-sidenav [mode]="sidenav.narrow() ? 'over' : 'side'" [opened]="sidenav.opened()" (openedChange)="openedChange($event)" role="navigation">
    @if (sidenav.narrow()) {
      <!-- Phones: a slide-over list. -->
      <mat-nav-list>
        @for (item of items(); track item.path) {
          <a mat-list-item (click)="sidenav.phoneMenuOpen.set(false)" [routerLink]="item.path" routerLinkActive #rla="routerLinkActive"
             [activated]="rla.isActive" [routerLinkActiveOptions]="{exact: !!item.exact}">
            <mat-icon matListItemIcon [matBadge]="item.badge || null" matBadgeSize="small" aria-hidden="false">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label | translate }}</span>
          </a>
        }
      </mat-nav-list>
    } @else {
      <!-- Tablets and up: a Material 3 navigation rail, so the buy grid keeps its width. -->
      <nav class="rail">
        @for (item of items(); track item.path) {
          <a class="rail-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: !!item.exact}">
            <span class="indicator">
              <mat-icon [matBadge]="item.badge || null" matBadgeSize="small" aria-hidden="false">{{ item.icon }}</mat-icon>
            </span>
            <span class="label">{{ item.label | translate }}</span>
          </a>
        }
      </nav>
    }
  </mat-sidenav>
  <mat-sidenav-content class="sidenav-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
