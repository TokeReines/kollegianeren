<mat-toolbar>
  <mat-toolbar-row>
    <button class="menu-button" mat-icon-button (click)="toggleSidenav()" [attr.aria-label]="'MENU' | translate"
            [matTooltip]="((sidenav.railHidden | async) ? 'MENU_SHOW' : 'MENU_HIDE') | translate">
      <mat-icon>{{ (sidenav.railHidden | async) ? 'menu' : 'menu_open' }}</mat-icon>
    </button>
    <span class="title" [class.kiosk]="sidenav.railHidden | async">{{ kitchenName | async }}</span>
    <span class="fill-space"></span>
    <button class="account-button" mat-icon-button [matMenuTriggerFor]="account" [attr.aria-label]="'ACCOUNT' | translate" [matTooltip]="'ACCOUNT' | translate">
      <img src="./assets/img/navbar_logo.jpg" alt="" />
    </button>
    <mat-menu #account="matMenu" xPosition="before" class="account-menu">
      <div class="account-header" (click)="$event.stopPropagation()">
        <img src="./assets/img/navbar_logo.jpg" alt="" />
        <div>
          <div class="account-kitchen">{{ kitchenName | async }}</div>
          <div class="account-email">{{ email | async }}</div>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="menu-label">{{ "THEME_TITLE" | translate }}</div>
      @for (m of themes; track m.mode) {
        <button mat-menu-item (click)="theme.set(m.mode)" [attr.aria-checked]="theme.mode === m.mode" role="menuitemradio">
          <mat-icon>{{ m.icon }}</mat-icon>
          <span>{{ m.label | translate }}</span>
          @if (theme.mode === m.mode) { <span class="check material-icons" aria-hidden="true">check</span> }
        </button>
      }
      <mat-divider></mat-divider>
      <div class="menu-label">{{ "LANGUAGE" | translate }}</div>
      @for (l of languages; track l.code) {
        <button mat-menu-item (click)="setLang(l.code)" [attr.aria-checked]="currentLanguage === l.code" role="menuitemradio">
          <mat-icon>translate</mat-icon>
          <span>{{ l.label }}</span>
          @if (currentLanguage === l.code) { <span class="check material-icons" aria-hidden="true">check</span> }
        </button>
      }
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ "LOG_OUT" | translate }}</span>
      </button>
    </mat-menu>
  </mat-toolbar-row>
</mat-toolbar>
