# Version updates once a week, grouped so a week gives a few PRs instead of one per package.
# Security updates come on their own as soon as an advisory is out (repo setting), grouped or not.
# Patch and minor updates of the app and rules-test merge themselves once CI is green
# (workflows/dependabot-auto-merge.yml); majors and everything in ops/ wait for a person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      # Angular moves as one: its packages must stay on the same version.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: [minor, patch]
      firebase:
        patterns: ["firebase", "@firebase/*"]
        update-types: [minor, patch]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /rules-test
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Cron jobs on tokeserver run these, and CI does not test them: merged by hand.
  - package-ecosystem: npm
    directory: /ops
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Europe/Copenhagen
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Europe/Copenhagen
    groups:
      actions:
        patterns: ["*"]
