# Version updates once a week, grouped so a week gives a few PRs instead of one per package.
# Security updates come as soon as an advisory is out, grouped per directory, but only patch and
# minor steps: a major among them would otherwise hold back every small fix in the same PR.
# Patch and minor updates of the app and rules-test merge themselves once CI is green
# (workflows/dependabot-auto-merge.yml); majors and everything in ops/ wait for a person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      # Angular moves as one: its packages must stay on the same version.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
        update-types: [minor, patch]
      firebase:
        patterns: ["firebase", "@firebase/*"]
        update-types: [minor, patch]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /rules-test
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Cron jobs on tokeserver run these, and CI does not test them: merged by hand.
  - package-ecosystem: npm
    directory: /ops
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Europe/Copenhagen
    # Dicebear 10 and later move the styles out of @dicebear/collection (there is no collection 11),
    # so a new core breaks the install. Only the seed scripts draw avatars: 9 stays.
    ignore:
      - dependency-name: "@dicebear/*"
        update-types: ["version-update:semver-major"]
    groups:
      dicebear:
        patterns: ["@dicebear/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Europe/Copenhagen
    groups:
      actions:
        patterns: ["*"]
