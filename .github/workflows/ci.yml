name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependabot writes lockfiles with npm 11, which leaves optional peers out (chokidar 6 under
      # the Angular CLI); the npm 10 that comes with Node 22 then refuses them in npm ci.
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx ng lint
      - run: npx ng test --watch=false
      # Both real targets must build and stay inside the bundle budget (angular.json).
      - run: npx ng build -c production
      - run: npx ng build -c dev

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      # Dependabot writes lockfiles with npm 11, which leaves optional peers out (chokidar 6 under
      # the Angular CLI); the npm 10 that comes with Node 22 then refuses them in npm ci.
      - run: npm install -g npm@11
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npm ci --no-audit --no-fund
        working-directory: rules-test
      - run: npm test
        working-directory: rules-test
