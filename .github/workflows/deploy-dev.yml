name: Deploy dev

# After CI passes on a push to develop, the app goes out on dev (kollegianeren.web.app): hosting
# only, never prod. Rules are still deployed by hand (ops/deploy-rules.js).
# FIREBASE_SERVICE_ACCOUNT_DEV is a key for github-deploy@kollegianeren.iam.gserviceaccount.com,
# which may deploy hosting on the dev project and nothing else.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  # By hand from the Actions tab, e.g. to put develop out again.
  workflow_dispatch:

# One deploy at a time; a newer push replaces one still waiting.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx ng build -c dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          projectId: kollegianeren
          channelId: live
