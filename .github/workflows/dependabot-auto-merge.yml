name: Dependabot auto-merge

# Approves a Dependabot PR and turns on auto-merge, so GitHub merges it when the required checks
# (CI: build and rules) pass. Only patch and minor updates of the app, rules-test and the CI actions;
# majors and ops/ (run by cron on tokeserver, not tested in CI) get no approval and wait for a person.
# Needs "Allow auto-merge" in the repo settings and build + rules as required checks on develop,
# or auto-merge would merge before CI has run.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'TokeReines/kollegianeren'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve and enable auto-merge
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch'
            || steps.meta.outputs.update-type == 'version-update:semver-minor')
          && steps.meta.outputs.directory != '/ops'
        run: |
          gh pr review --approve "$PR" --body "Patch or minor update: merges itself when CI is green."
          gh pr merge --auto --merge "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
