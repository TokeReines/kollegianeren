name: Dependabot auto-merge

# Approves a Dependabot PR and turns on auto-merge, so GitHub merges it when the required checks
# (CI: build and rules) pass. Only patch and minor updates of the app, rules-test and the CI actions;
# majors and anything touching ops/ (run by cron on tokeserver, not tested in CI) get no approval and wait for a person.
# Needs "Allow auto-merge" in the repo settings and build + rules as required checks on develop,
# or auto-merge would merge before CI has run.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'TokeReines/kollegianeren'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # A security update that moves several packages together ("Bump minimatch, eslint and ...")
      # comes without an update type. Then the largest step named in the PR text counts: each
      # "Updates `name` from 1.2.3 to 1.4.0". On 0.x a minor step counts as major, and a version that
      # does not parse (a pre-release, say) counts as major too.
      - id: size
        run: |
          node -e '
            const meta = process.env.META_TYPE;
            if (meta && meta !== "null") { console.log(`bump=${meta.replace("version-update:semver-", "")}`); process.exit(); }
            const parse = v => /^\d+\.\d+\.\d+$/.test(v) ? v.split(".").map(Number) : null;
            const rank = {patch: 0, minor: 1, major: 2};
            let bump = null;
            for (const [, from, to] of process.env.BODY.matchAll(/^Updates `[^`]+` from (\S+) to (\S+)$/gm)) {
              const a = parse(from), b = parse(to);
              const step = !a || !b || a[0] !== b[0] || (a[0] === 0 && a[1] !== b[1]) ? "major" : a[1] !== b[1] ? "minor" : "patch";
              if (bump === null || rank[step] > rank[bump]) bump = step;
            }
            console.log(`bump=${bump ?? "unknown"}`);
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
        env:
          META_TYPE: ${{ steps.meta.outputs.update-type }}
          BODY: ${{ github.event.pull_request.body }}
      - name: Approve and enable auto-merge
        if: steps.size.outputs.bump == 'patch' || steps.size.outputs.bump == 'minor'
        run: |
          # A grouped security update can span several directories and still report "/", so the
          # changed files decide whether ops/ is touched.
          if gh pr diff --name-only "$PR" | grep -q '^ops/'; then
            echo "Touches ops/: left for a person."
            exit 0
          fi
          gh pr review --approve "$PR" --body "Patch or minor update: merges itself when CI is green."
          gh pr merge --auto --merge "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
